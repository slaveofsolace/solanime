# Non-active template. Copy deliberately into .github/workflows/ only when enabling a refresh.
name: FMHY research refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-dump/fmhy-video
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r data-dump/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s data-dump/tests -v
      - run: python data-dump/tools/enrich.py --seconds 600 --repositories 35 --browser-sites 16
      - run: python data-dump/tools/deepen.py --seconds 180 --modules 8
      - run: python data-dump/tools/enrich.py --offline
      - run: python data-dump/tools/audit.py
      - name: Commit only research data
        run: |
          test "$(git branch --show-current)" = data-dump/fmhy-video
          git add -- data-dump/
          if ! git diff --cached --quiet; then
            git -c user.name='Solanime research' -c user.email='research@users.noreply.github.com' commit -m 'data-dump: refresh public research snapshot'
            git push origin HEAD:refs/heads/data-dump/fmhy-video
          fi
