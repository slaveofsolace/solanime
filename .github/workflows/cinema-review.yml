name: Cinema release review
on:
  push:
    branches: [feat/solanime-cinema]
    paths: [.github/workflows/cinema-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete traced interface regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/WatchPage.tsx');s=p.read_text()
          old='        <div className="episode-nav" aria-label="Episode navigation">'
          new=old+'''
                    <button
                      type="button"
                      className="theater-toggle"
                      aria-label={theater ? 'Exit theater mode' : 'Theater mode'}
                      title={theater ? 'Exit theater mode' : 'Theater mode'}
                      aria-pressed={theater}
                      onClick={() => setTheater((value) => !value)}
                    >
                      <Icon name="theater" />
                    </button>'''
          assert old in s and 'className="theater-toggle"' not in s
          p.write_text(s.replace(old,new,1))
          p=Path('src/pages/LibraryPage.tsx');s=p.read_text()
          label=s.index('              <strong>Interface theme</strong>')
          start=s.rfind('          <label>',0,label)
          end=s.index('          </label>',label)+len('          </label>\n')
          assert start >= 0
          p.write_text(s[:start]+s[end:])
          p=Path('tests/e2e/cinema.spec.ts');s=p.read_text()
          old="  await page.screenshot({ path: info.outputPath('protected-watch.png'), fullPage: true });"
          new=old+'''
            await page.getByRole('button', { name: 'Exit theater mode', exact: true }).click();
            await expect(page.locator('.watch-page')).not.toHaveClass(/watch-page--theater/);
            expect(await handle!.evaluate((el) => el.isConnected)).toBe(true);'''
          assert old in s;p.write_text(s.replace(old,new))
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          npm install --prefix /tmp/formatter --ignore-scripts prettier@3.6.2
          node /tmp/formatter/node_modules/prettier/bin/prettier.cjs --write src/pages/WatchPage.tsx src/pages/LibraryPage.tsx tests/e2e/cinema.spec.ts
          mkdir -p /tmp/cinema-evidence
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/cinema-evidence/check.log
      - name: Commit source only on the review branch
        run: |
          test "$GITHUB_REF_NAME" = 'feat/solanime-cinema'
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WatchPage.tsx src/pages/LibraryPage.tsx tests/e2e/cinema.spec.ts
          git diff --cached --exit-code -- .github/workflows data
          git commit -m 'Complete theater-mode controls and simplify appearance settings'
          git push origin HEAD:refs/heads/feat/solanime-cinema
          git rev-parse HEAD > /tmp/cinema-evidence/commit.txt
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Website acceptance without retries
        id: website
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test --retries=0 2>&1 | tee /tmp/cinema-evidence/browser.log
      - name: Preserve website evidence
        if: always()
        run: |
          if [ -d test-results ]; then cp -R test-results /tmp/cinema-evidence/website-test-results; fi
          if [ -d playwright-report ]; then cp -R playwright-report /tmp/cinema-evidence/website-report; fi
      - name: Guard integration without retries
        id: guard
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test --config playwright.guard.config.ts --retries=0 2>&1 | tee /tmp/cinema-evidence/guard.log
      - name: Preserve Guard evidence
        if: always()
        run: |
          if [ -d test-results/guard ]; then cp -R test-results/guard /tmp/cinema-evidence/guard-test-results; fi
      - name: Real catalogue screenshots and integrity
        if: always()
        run: |
          test -f dist/index.html || exit 0
          sha256sum data/solanime.sqlite > /tmp/cinema-evidence/database.sha256
          cp data/solanime.sqlite /tmp/cinema-catalogue.sqlite
          SOLANIME_DB_PATH=/tmp/cinema-catalogue.sqlite pnpm doctor > /tmp/cinema-evidence/doctor.log
          PORT=18788 SOLANIME_DB_PATH=/tmp/cinema-catalogue.sqlite node --import tsx server/app.ts --serve-static > /tmp/cinema-evidence/runtime.log 2>&1 &
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:18788/api/health && break || sleep 1; done
          cat > .cinema-visual.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser = await chromium.launch(); const evidence=[];
          for (const [name,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]) {
            const page = await browser.newPage({viewport}); const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.route('**/api/providers/*/resolve',route=>route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({error:{code:'REVIEW_ONLY',message:'Live provider playback is outside this isolated visual review.'}})}));
            for (const [label,path] of [['home','/'],['catalogue','/catalogue?q=naruto'],['settings','/library']]) {
              await page.goto('http://127.0.0.1:18788'+path); await page.waitForTimeout(2000);
              await page.screenshot({path:`/tmp/cinema-evidence/${label}-${name}.png`,fullPage:true});
              evidence.push({name,label,url:page.url(),errors:[...errors],overflow:await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1)});
            }
            await page.close();
          }
          fs.writeFileSync('/tmp/cinema-evidence/visual.json',JSON.stringify(evidence,null,2)); await browser.close();
          JS
          node .cinema-visual.mjs
      - name: Package reviewable source with original catalogue
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          with zipfile.ZipFile('/tmp/cinema-evidence/solanime-cinema-v0.3.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if name and Path(name).is_file() and name != '.github/workflows/cinema-review.yml' and not name.startswith('.review/'):
                      z.write(name,'solanime/'+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema-release-review
          path: /tmp/cinema-evidence
          retention-days: 7
      - name: Require both browser suites
        if: steps.website.outcome == 'failure' || steps.guard.outcome == 'failure'
        run: exit 1
