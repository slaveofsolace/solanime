name: FMHY Video research final audit
on:
  push:
    branches: [data-dump/fmhy-video]
    paths: [data-dump/tools/**, data-dump/tests/**, .github/workflows/fmhy-video-research.yml]
permissions:
  contents: write
concurrency:
  group: fmhy-video-public-research
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-dump/fmhy-video
          fetch-depth: 2
          sparse-checkout: data-dump
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r data-dump/requirements.txt
      - name: Regression and evidence-quality tests
        run: |
          python -m unittest discover -s data-dump/tests -v
          python -m py_compile data-dump/tools/*.py
      - name: Targeted depth and final data audit
        run: |
          python data-dump/tools/deepen.py --seconds 180 --modules 8 | tee data-dump/reports/deepening.log
          python data-dump/tools/enrich.py --offline | tee data-dump/reports/final-indexing.log
          python data-dump/tools/audit.py | tee data-dump/reports/audit.log
          python -m pip freeze > data-dump/sources/python-environment.txt
      - name: Preserve reviewed architecture reports
        run: |
          git show HEAD:data-dump/reports/architecture-map.md > data-dump/reports/architecture-map.md
          git show HEAD:data-dump/reports/findings.md > data-dump/reports/findings.md
      - name: Finalize dataset-only tree
        run: |
          test "$(git branch --show-current)" = data-dump/fmhy-video
          git rm -f --sparse -- .github/workflows/fmhy-video-research.yml
          git add -- data-dump/
          git ls-files data-dump/ > data-dump/FILE_MANIFEST.txt
          git add -- data-dump/FILE_MANIFEST.txt
          git ls-files data-dump/ > data-dump/FILE_MANIFEST.txt
          git add -- data-dump/FILE_MANIFEST.txt
          git -c user.name='Solanime research' -c user.email='research@users.noreply.github.com' commit -m 'data-dump: finalize audited dataset, architecture reports and implementation handoff'
          git push origin HEAD:refs/heads/data-dump/fmhy-video
          git archive --format=zip --output=/tmp/fmhy-video-data-dump.zip HEAD:data-dump
          sha256sum /tmp/fmhy-video-data-dump.zip > /tmp/fmhy-video-data-dump.zip.sha256
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          cat data-dump/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fmhy-video-data-dump-final
          path: |
            /tmp/fmhy-video-data-dump.zip
            /tmp/fmhy-video-data-dump.zip.sha256
          retention-days: 14
