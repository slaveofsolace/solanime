name: FMHY research privacy and package verification
on:
  push:
    branches: [data-dump/fmhy-video]
    paths: [data-dump/tools/scrub.py, data-dump/tests/test_scrub.py, .github/workflows/fmhy-video-research.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-dump/fmhy-video
          fetch-depth: 2
          sparse-checkout: data-dump
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r data-dump/requirements.txt
      - name: Redact transient parameters and validate
        run: |
          python data-dump/tools/scrub.py
          python -m unittest discover -s data-dump/tests -v
          python -m py_compile data-dump/tools/*.py
      - name: Commit dataset-only final state
        run: |
          test "$(git branch --show-current)" = data-dump/fmhy-video
          git rm -f --sparse -- .github/workflows/fmhy-video-research.yml
          git add -- data-dump/
          git ls-files data-dump/ > data-dump/FILE_MANIFEST.txt
          git add -- data-dump/FILE_MANIFEST.txt
          git -c user.name='Solanime research' -c user.email='research@users.noreply.github.com' commit -m 'data-dump: redact transient URL state and verify final research package'
          git push origin HEAD:refs/heads/data-dump/fmhy-video
          git archive --format=zip --output=/tmp/fmhy-video-data-dump.zip HEAD:data-dump
          sha256sum /tmp/fmhy-video-data-dump.zip > /tmp/fmhy-video-data-dump.zip.sha256
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          cat data-dump/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fmhy-video-data-dump-final
          path: |
            /tmp/fmhy-video-data-dump.zip
            /tmp/fmhy-video-data-dump.zip.sha256
          retention-days: 14
