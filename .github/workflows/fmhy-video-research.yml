name: FMHY Video public research
on:
  push:
    branches: [data-dump/fmhy-video]
    paths: [data-dump/tools/**, data-dump/tests/**, data-dump/requirements.txt, .github/workflows/fmhy-video-research.yml]
permissions:
  contents: write
concurrency:
  group: fmhy-video-public-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-dump/fmhy-video
          fetch-depth: 2
          sparse-checkout: data-dump
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          python -m pip install -r data-dump/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collector regression tests
        run: |
          python -m unittest discover -s data-dump/tests -v
          python -m py_compile data-dump/tools/collect.py data-dump/tools/enrich.py
      - name: Resume public research and map relationships
        run: |
          mkdir -p data-dump/reports
          if [ ! -f data-dump/SUMMARY.json ]; then
            python data-dump/tools/collect.py --seconds 600 --workers 8 --max-js 2 | tee data-dump/reports/collection.log
          fi
          python data-dump/tools/enrich.py --seconds 600 --repositories 35 --browser-sites 16 | tee data-dump/reports/enrichment.log
          python -m pip freeze > data-dump/sources/python-environment.txt
      - name: Commit dataset only to research branch
        run: |
          test "$(git branch --show-current)" = data-dump/fmhy-video
          git add -- data-dump/
          if ! git diff --cached --quiet; then
            git -c user.name='Solanime research' -c user.email='research@users.noreply.github.com' commit -m 'data-dump: enrich FMHY coverage, repositories and public network observations'
            git push origin HEAD:refs/heads/data-dump/fmhy-video
          fi
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          cat data-dump/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmhy-video-research-snapshot
          path: data-dump/
          retention-days: 14
