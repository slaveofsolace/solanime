name: Accounts release review
on:
  push:
    branches: [feat/accounts-built-in-player]
    paths: [.github/workflows/accounts-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply traced account lifecycle corrections
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/accounts-built-in-player
          mkdir -p /tmp/accounts-review
          git apply --check .review/account-conflict.patch
          git apply .review/account-conflict.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');s=p.read_text()
          old='    <PageErrorBoundary>\n      <AccountProvider>\n        <AccountBoundary>\n          <Layout>\n            <Suspense'
          assert old in s
          s=s.replace(old,'    <AccountProvider>\n      <AccountBoundary>\n        <Layout>\n          <PageErrorBoundary>\n            <Suspense')
          s=s.replace('          </Layout>\n        </AccountBoundary>\n      </AccountProvider>\n    </PageErrorBoundary>','          </PageErrorBoundary>\n        </Layout>\n      </AccountBoundary>\n    </AccountProvider>')
          p.write_text(s)
          p=Path('tests/e2e/accounts.spec.ts');s=p.read_text()
          s=s.replace("    await expect(page.locator('main h1')).toBeVisible();", "    await expect(page.getByLabel('Email address', { exact: true })).toBeVisible();\n    await expect(page.locator('.auth-panel form')).toBeVisible();")
          s=s.replace("  await page.goto('/login');\n  await page.screenshot", "  await page.goto('/login');\n  await expect(page.getByLabel('Email address', { exact: true })).toBeVisible();\n  await page.screenshot")
          p.write_text(s)
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Typecheck, unit/API regressions and build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/accounts-review/check.log
      - name: Commit application changes to review branch only
        run: |
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .review/account-conflict.patch
          git add src/App.tsx src/account/AccountProvider.tsx src/pages/AccountPage.tsx tests/e2e/accounts.spec.ts
          git add -u .review
          git diff --cached --exit-code -- .github/workflows data
          git commit -m 'Preserve accounts across navigation and allow explicit sign-out after sync conflicts'
          git push origin HEAD:refs/heads/feat/accounts-built-in-player
          git rev-parse HEAD > /tmp/accounts-review/commit.txt
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Website browser acceptance without retries
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test --retries=0 2>&1 | tee /tmp/accounts-review/browser.log
      - name: Database startup on a private copy
        if: always()
        run: |
          cp data/solanime.sqlite /tmp/accounts-review/catalogue.sqlite
          SOLANIME_DB_PATH=/tmp/accounts-review/catalogue.sqlite pnpm run doctor > /tmp/accounts-review/doctor.json
          rm -f /tmp/accounts-review/catalogue.sqlite /tmp/accounts-review/catalogue.sqlite-wal /tmp/accounts-review/catalogue.sqlite-shm
      - name: Capture changed source for exact reconciliation
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git','diff','--name-only','ef65bb9a515d3b6030cd95d07e5dcf4f0e3e86a9','HEAD','--','src','server','scripts','tests','config','docs','package.json','public','README.md','.env.example','.gitignore']).decode().splitlines()
          with zipfile.ZipFile('/tmp/accounts-review/changed-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for name in paths:
              if pathlib.Path(name).is_file(): archive.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-release-review
          path: |
            /tmp/accounts-review/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Require passing browser acceptance
        if: steps.browser.outcome == 'failure'
        run: exit 1
