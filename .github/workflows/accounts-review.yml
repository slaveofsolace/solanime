name: Accounts release review
on:
  push:
    branches: [feat/accounts-built-in-player]
    paths: [.github/workflows/accounts-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct traced recovery and focus transitions
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/accounts-built-in-player
          mkdir -p /tmp/accounts-review
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AuthPage.tsx');s=p.read_text();old="          setReplacement(null);\n          navigate('/login'";assert old in s;s=s.replace(old,"          navigate('/login'");p.write_text(s)
          p=Path('src/components/Dialog.tsx');s=p.read_text();old='      previousFocus?.focus({ preventScroll: true });';assert old in s;s=s.replace(old,'''      if (previousFocus?.isConnected) previousFocus.focus({ preventScroll: true });
                else {
                  // The opening control can disappear when the fifth profile replaces Add profile.
                  const fallback = document.querySelector<HTMLElement>('[data-dialog-fallback-focus]')
                    ?? document.querySelector<HTMLElement>('main');
                  fallback?.focus();
                }''');p.write_text(s)
          p=Path('src/pages/ProfilesPage.tsx');s=p.read_text().replace('<h1>{manage ?', '<h1 tabIndex={-1} data-dialog-fallback-focus>{manage ?');p.write_text(s)
          p=Path('src/components/ui.tsx');s=p.read_text().replace('{account.account && !account.profile && (', "{account.account && !account.profile && !['/profiles', '/account', '/account/recovery-code'].includes(location.pathname) && (");p.write_text(s)
          p=Path('src/styles.css');s=p.read_text();s+='\n/* Keep dialog-return headings below the sticky navigation. */\n[data-dialog-fallback-focus] { scroll-margin-top: 150px; }\n[data-dialog-fallback-focus]:focus:not(:focus-visible) { outline: none; }\n';p.write_text(s)
          p=Path('tests/e2e/accounts.spec.ts');s=p.read_text();old="  await page.getByRole('button', { name: 'Continue', exact: true }).click();\n  await page.getByLabel('Email address', { exact: true }).fill(email);";assert old in s;s=s.replace(old,"  await page.getByRole('button', { name: 'Continue', exact: true }).click();\n  await expect(page).toHaveURL(/\\/login$/);\n  await page.getByLabel('Email address', { exact: true }).fill(email);")
          old="  await overflow(page);\n  await page.screenshot({ path: info.outputPath('five-profiles.png'), fullPage: true });";assert old in s;s=s.replace(old,"  await expect(page.locator('.skip-link')).not.toBeFocused();\n  await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));\n  await expect(page.getByRole('heading', { name: 'Who’s watching?' })).toBeInViewport();\n"+old);p.write_text(s)
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          npm install --prefix /tmp/formatter --ignore-scripts prettier@3.6.2
          node /tmp/formatter/node_modules/prettier/bin/prettier.cjs --write src/App.tsx src/account/AccountProvider.tsx src/pages/AccountPage.tsx src/pages/AuthPage.tsx src/pages/ProfilesPage.tsx src/components/Dialog.tsx src/components/ui.tsx src/styles.css tests/e2e/accounts.spec.ts
      - name: Typecheck, unit/API regressions and build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/accounts-review/check.log
      - name: Commit application changes to review branch only
        run: |
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/e2e/accounts.spec.ts
          git diff --cached --exit-code -- .github/workflows data
          git commit -m 'Keep recovery transition stable and restore focus after the last profile is added'
          git push origin HEAD:refs/heads/feat/accounts-built-in-player
          git rev-parse HEAD > /tmp/accounts-review/commit.txt
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Website browser acceptance without retries
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test --retries=0 2>&1 | tee /tmp/accounts-review/browser.log
      - name: Database startup on a private copy
        if: always()
        run: |
          cp data/solanime.sqlite /tmp/accounts-review/catalogue.sqlite
          SOLANIME_DB_PATH=/tmp/accounts-review/catalogue.sqlite pnpm run doctor > /tmp/accounts-review/doctor.json
          rm -f /tmp/accounts-review/catalogue.sqlite /tmp/accounts-review/catalogue.sqlite-wal /tmp/accounts-review/catalogue.sqlite-shm
      - name: Capture changed source for exact reconciliation
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git','diff','--name-only','ef65bb9a515d3b6030cd95d07e5dcf4f0e3e86a9','HEAD','--','src','server','scripts','tests','config','docs','package.json','public','README.md','.env.example','.gitignore']).decode().splitlines()
          with zipfile.ZipFile('/tmp/accounts-review/changed-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for name in paths:
              if pathlib.Path(name).is_file(): archive.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounts-release-review
          path: |
            /tmp/accounts-review/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Require passing browser acceptance
        if: steps.browser.outcome == 'failure'
        run: exit 1
