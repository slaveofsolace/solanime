name: Cinema package verification
on:
  push:
    branches: [feat/solanime-cinema]
    paths: [.github/workflows/cinema-package.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Disambiguate the project diagnostic from pnpm's built-in doctor
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['README.md','docs/DEPLOY_CINEMA.md','docs/OPERATIONS.md']:
              p=Path(name);text=p.read_text();assert 'pnpm doctor' in text
              p.write_text(text.replace('pnpm doctor','pnpm run doctor'))
          PY
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/DEPLOY_CINEMA.md docs/OPERATIONS.md
          git commit -m 'Invoke the project database diagnostic explicitly in setup documentation'
          git push origin HEAD:refs/heads/feat/solanime-cinema
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify the documented database check without mutating the source checkpoint
        run: |
          mkdir -p /tmp/cinema-package
          cp data/solanime.sqlite /tmp/cinema-doctor.sqlite
          set -o pipefail
          SOLANIME_DB_PATH=/tmp/cinema-doctor.sqlite pnpm run doctor 2>&1 | tee /tmp/cinema-package/database-check.log
          git diff --exit-code -- data/solanime.sqlite
          git rev-parse HEAD > /tmp/cinema-package/commit.txt
          sha256sum data/solanime.sqlite > /tmp/cinema-package/database.sha256
      - name: Package the complete source and the optional extension separately
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib
          root=Path('/tmp/cinema-package')
          with zipfile.ZipFile(root/'solanime-cinema-v0.3.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if name and Path(name).is_file() and name != '.github/workflows/cinema-package.yml' and not name.startswith('.review/'):
                      assert Path(name).suffix.lower() not in {'.ttf','.woff','.woff2','.otf','.eot'}
                      z.write(name,'solanime/'+name)
          with zipfile.ZipFile(root/'solanime-guard-v0.3.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('extensions/solanime-guard').glob('*')):
                  if p.is_file():z.write(p,'solanime-guard/'+p.name)
          for name in ['solanime-cinema-v0.3.zip','solanime-guard-v0.3.zip']:
              (root/(name+'.sha256')).write_text(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-downloads
          path: /tmp/cinema-package
          retention-days: 7
