name: Quality
on:
  push:
    branches: [main, fix/solanime-quality-pass, feat/solanime-cinema]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Types, unit/API regressions and build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ runner.os }}
          path: check.log
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Website browser acceptance
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            browser.log
            playwright-report/
            test-results/
          retention-days: 7
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Isolated Chromium Guard integration
        run: |
          set -o pipefail
          pnpm test:guard 2>&1 | tee guard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-evidence
          path: |
            guard.log
            test-results/
          retention-days: 7
