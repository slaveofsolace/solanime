name: Baseline browser review
on:
  push:
    branches: [fix/solanime-quality-pass]
    paths: [.github/workflows/browser-review.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f9147bdbe8a7652115eb995b94bbb8026e7e787
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture baseline
        run: |
          mkdir -p /tmp/browser-review
          pnpm dev > /tmp/browser-review/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/api/health && break || sleep 1; done
          cat > .baseline-browser.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const browser = await chromium.launch();
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          await page.goto('http://127.0.0.1:5173/');
          await page.waitForTimeout(4000);
          await page.screenshot({path:'/tmp/browser-review/before-home-desktop.png',fullPage:true});
          await page.setViewportSize({width:390,height:844});
          await page.goto('http://127.0.0.1:5173/catalogue');
          await page.waitForTimeout(2500);
          await page.screenshot({path:'/tmp/browser-review/before-catalogue-mobile.png',fullPage:true});
          await page.evaluate(()=>localStorage.setItem('sol-anime:watchlist-records','null'));
          await page.reload();
          await page.waitForTimeout(500);
          fs.writeFileSync('/tmp/browser-review/baseline.json',JSON.stringify({errors,body:await page.locator('body').innerText()},null,2));
          await browser.close();
          JS
          node .baseline-browser.mjs
      - name: Package local formatter
        if: always()
        run: |
          npm install --prefix /tmp/formatter --ignore-scripts prettier@3.6.2
          tar -czf /tmp/browser-review/formatter.tgz -C /tmp/formatter/node_modules prettier
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solanime-baseline-browser
          path: /tmp/browser-review
          retention-days: 3
