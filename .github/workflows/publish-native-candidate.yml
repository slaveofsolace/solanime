name: Publish existing native candidate
on:
  push:
    branches: [feat/studio-v05]
    paths: [.github/workflows/publish-native-candidate.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and verify the already-delivered candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/studio-v05
          mkdir -p /tmp/native-publish
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, struct, subprocess, urllib.request
          base = '4fd60a177f06afd2e43a79e1521c4888b4eda545'
          shas = ['8615e712c8282f4d7c8eec62d332871d47498fa1','16910a16f4760cf6ff634a8789da737649f5d7db','f8f5e6d1236c8224312275a603462a7a7b6a3a4a','d0d3df3257b24411929480b21123f1d9b0265c72','8775bd0e5757240b5de977a7c6c5ae517f90a6c5','372aedeb9cacf252c6ca55e6a0bb40895a008659']
          chunks=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/slaveofsolace/solanime/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              assert item['sha']==sha and item['encoding']=='base64'
              chunks.append(base64.b64decode(item['content']).decode('ascii'))
          compressed=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='ea8d83ebc5eed868b9a0cf0891e58da48ecadaefc49c6b98e9722b645a602e4d','Transfer checksum mismatch'
          raw=lzma.decompress(compressed); length=struct.unpack_from('<I',raw)[0]
          assert length<20000 and len(raw)<1000000
          meta=json.loads(raw[4:4+length]); operations=raw[4+length:]
          assert meta['base']==base
          source=b''.join(subprocess.check_output(['git','cat-file','blob',base+':'+path]) for path in meta['basePaths'])
          assert hashlib.sha256(source).hexdigest()==meta['baseHash'],'Baseline differs from the delivered patch'
          paths=[path for path,size in meta['files']]+meta['deleted']
          assert len(paths)==len(set(paths)) and meta['deleted']==['src/styles/cinematic.css','src/styles/studio.css']
          for name in paths:
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.git','.github','data'} and (name!='.env')
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',*paths],check=True)
          target=bytearray(); cursor=0
          while cursor<len(operations):
              code=operations[cursor]; cursor+=1
              if code==0:
                  size=struct.unpack_from('<I',operations,cursor)[0]; cursor+=4
                  assert cursor+size<=len(operations); target.extend(operations[cursor:cursor+size]); cursor+=size
              elif code==1:
                  offset,size=struct.unpack_from('<II',operations,cursor); cursor+=8
                  assert offset+size<=len(source); target.extend(source[offset:offset+size])
              else: raise ValueError('Unknown transfer operation')
              assert len(target)<=meta['targetSize']
          assert len(target)==meta['targetSize'] and hashlib.sha256(target).hexdigest()==meta['targetHash'],'Candidate checksum mismatch'
          offset=0
          for name,size in meta['files']:
              path=pathlib.Path(name); assert not path.is_symlink()
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(target[offset:offset+size]); offset+=size
          assert offset==len(target)
          for name in meta['deleted']: pathlib.Path(name).unlink()
          pathlib.Path('/tmp/native-publish/paths.json').write_text(json.dumps(paths))
          pathlib.Path('/tmp/native-publish/verification.json').write_text(json.dumps({'base':base,'targetHash':meta['targetHash'],'files':len(meta['files']),'deleted':meta['deleted'],'patchSha256':'84c8036bbed68d4fdc3177d2e12bc69cb10081d50f29fd757f021114ee7d7318'},indent=2))
          print('Candidate source verified; catalogue, private accounts and secrets were not modified.')
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Types, unit/API regressions and production build
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/native-publish/check.log
      - name: Commit and push candidate source without merging
        run: |
          set -euo pipefail
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/native-publish/paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','--','.github/workflows','data'],check=True)
          PY
          git commit -m 'Commit delivered v0.6 native-player and site-wide redesign candidate'
          git push origin HEAD:refs/heads/feat/studio-v05
          git rev-parse HEAD > /tmp/native-publish/commit.txt
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Full HTTP browser tests without retries
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec playwright test --retries=0 2>&1 | tee /tmp/native-publish/browser.log
      - name: Package changed-file manifest and source
        if: always()
        run: |
          python - <<'PY'
          import subprocess,zipfile,pathlib
          root=pathlib.Path.cwd()
          with zipfile.ZipFile('/tmp/native-publish/source.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for name in filter(None,subprocess.check_output(['git','ls-tree','-r','--name-only','-z','HEAD']).decode().split('\0')):
              archive.writestr('solanime/'+name,subprocess.check_output(['git','cat-file','blob','HEAD:'+name]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-candidate-publish
          path: |
            /tmp/native-publish/
            test-results/
            playwright-report/
          retention-days: 7
      - name: Report browser failures accurately
        if: steps.browser.outcome == 'failure'
        run: exit 1
