name: Studio theme contrast repair
on:
  push:
    branches: [feat/studio-v05]
    paths: [.github/workflows/studio-contrast.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove mixed-palette text animation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles/studio.css');s=p.read_text()
          old='''.main-nav > a {
            transition:
              color var(--motion-fast),
              opacity var(--motion-fast);
          }'''.replace('\n          ', '\n')
          assert old in s
          s=s.replace(old, '''/* Theme text and its background change together; interpolating only the
           * text color creates unreadable intermediate frames on a light background. */
          .main-nav > a {
            transition: transform var(--motion-fast);
          }'''.replace('\n          ', '\n'))
          p.write_text(s)
          p=Path('tests/e2e/accounts.spec.ts');s=p.read_text()
          old="  await page.getByRole('button', { name: 'Use light theme' }).click();\n  const results = await new AxeBuilder({ page }).withTags(['wcag2a', 'wcag2aa']).analyze();"
          assert old in s
          s=s.replace(old, '''  await page.getByRole('button', { name: 'Use light theme' }).click();
            await expect(page.locator('html')).toHaveAttribute('data-theme', 'light');
            const link = page.getByRole('navigation', { name: 'Primary navigation' }).getByRole('link', { name: 'Home', exact: true });
            expect(await link.evaluate((element) => getComputedStyle(element).transitionProperty)).not.toMatch(/color|all/);
            await expect(link).toHaveCSS('color', 'rgb(92, 92, 92)');
            const results = await new AxeBuilder({ page }).withTags(['wcag2a', 'wcag2aa']).analyze();'''.replace('\n            ', '\n  '))
          p.write_text(s)
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm check
      - name: Commit correction to existing review branch
        run: |
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/studio.css tests/e2e/accounts.spec.ts
          git commit -m 'Keep navigation contrast atomic during theme changes'
          git push origin HEAD:refs/heads/feat/studio-v05
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify full browser suite with retries disabled
        run: |
          set -o pipefail
          pnpm exec playwright test --retries=0 2>&1 | tee browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-contrast-evidence
          path: |
            browser.log
            test-results/
            playwright-report/
          retention-days: 7
