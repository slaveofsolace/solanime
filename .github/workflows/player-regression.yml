name: Player regression repair
on:
  push:
    branches: [fix/solanime-quality-pass]
    paths: [.github/workflows/player-regression.yml]
permissions:
  contents: write
concurrency:
  group: player-regression-repair
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply isolated regression repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/WatchPage.tsx');s=p.read_text()
          old='  const [params, setParams] = useSearchParams();'
          new='''  const [params, updateParams] = useSearchParams();
            // URL updates must not restart the provider-list request on each server selection.
            const updateParamsRef = useRef(updateParams);
            updateParamsRef.current = updateParams;
            const setParams = useCallback<typeof updateParams>(
              (next, options) => updateParamsRef.current(next, options),
              [],
            );'''
          if old in s:s=s.replace(old,new)
          else:assert 'const updateParamsRef = useRef(updateParams);' in s
          s=s.replace('OPENING WATCH ROOM','').replace('Retrieving the title, version, and stored server mappings.','Loading the episode and available servers.')
          s=s.replace("{episodeComments.length} comment{episodeComments.length === 1 ? '' : 's'}", "{episodeComments.length} note{episodeComments.length === 1 ? '' : 's'}")
          s=s.replace('<span>Comment</span>','<span>Note</span>').replace('Comments stay in this browser and are not posted publicly.','Notes stay in this browser and are not posted publicly.')
          s=s.replace('<h2>Select an available server.</h2>', "<h2>{loadingProviders ? 'Loading servers…' : providers.length ? 'Select an available server.' : 'No servers for this episode'}</h2>")
          s=s.replace('<p>Server availability depends on the provider.</p>', "<p>{providers.length ? 'Server availability depends on the provider.' : 'The episode is in the catalogue, but no sources have been imported for this version.'}</p>")
          p.write_text(s)
          p=Path('src/styles.css');s=p.read_text()
          marker='/* Constrain placeholder geometry as well as the media element on narrow screens. */'
          if marker not in s:s+='\n'+marker+'\n.player-empty, .player-consent { width: 100%; min-width: 0; }\n.player-empty > *, .player-consent > * { max-width: 100%; }\n'
          p.write_text(s)
          p=Path('tests/e2e/application.spec.ts');s=p.read_text()
          if 'let providerLists = 0;' not in s:
            start=s.index("test('server switching,");body=s.index('  const data = await episode(page);',start)
            s=s[:body]+"  let providerLists = 0;\n  page.on('request', (request) => { if (/\\/api\\/episodes\\/\\d+\\/providers/.test(request.url())) providerLists++; });\n"+s[body:]
            needle="  await page\n    .getByRole('group', { name: 'Episode language' })"
            assert needle in s;s=s.replace(needle,'  expect(providerLists).toBe(1);\n'+needle)
          start=s.index("  await page.route('**/__fixture/motion.mp4'");end=s.index('\n  await page.goto(',start)
          s=s[:start]+r'''  await page.route('**/__fixture/motion.mp4', (route) => {
            const bytes = readFileSync(resolve('tests/fixtures/motion.mp4'));
            const range = /^bytes=(\d+)-(\d*)$/.exec(route.request().headers()['range'] ?? '');
            if (!range) return route.fulfill({ contentType: 'video/mp4', headers: { 'accept-ranges': 'bytes' }, body: bytes });
            const start = Number(range[1]);
            const end = Math.min(range[2] ? Number(range[2]) : bytes.length - 1, bytes.length - 1);
            if (start >= bytes.length || end < start) return route.fulfill({ status: 416, headers: { 'content-range': `bytes */${bytes.length}` } });
            return route.fulfill({ status: 206, contentType: 'video/mp4', headers: { 'accept-ranges': 'bytes', 'content-range': `bytes ${start}-${end}/${bytes.length}`, 'content-length': String(end - start + 1) }, body: bytes.subarray(start, end + 1) });
          });'''+s[end:]
          s=s.replace('element.currentTime = element.duration - 0.3;', 'element.currentTime = 1;')
          if "test('player messages stay inside" not in s:
            s+='''
          test('player messages stay inside the mobile viewport', async ({ page }, testInfo) => {
            const data = await episode(page);
            await page.goto(`/watch/paper-lantern/${data.first.id}?language=sub`);
            await expect(page.getByRole('button', { name: 'Play here', exact: true })).toBeVisible();
            const bounds = await page.locator('.player-stage').evaluate((stage) => {
              const container = stage.getBoundingClientRect();
              return [...stage.querySelectorAll('.player-consent h2, .player-consent p, .player-consent button')].every((child) => { const rect = child.getBoundingClientRect(); return rect.left >= container.left && rect.right <= container.right; });
            });
            expect(bounds).toBe(true);
            await page.screenshot({ path: testInfo.outputPath('watch-consent.png'), fullPage: true });
          });
          '''
          p.write_text(s)
          PY
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          npm install --prefix /tmp/formatter --ignore-scripts prettier@3.6.2
          node /tmp/formatter/node_modules/prettier/bin/prettier.cjs --write src/pages/WatchPage.tsx src/styles.css tests/e2e/application.spec.ts
          pnpm check
      - name: Commit regression repair to review branch
        run: |
          git config user.name 'Solanime maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/WatchPage.tsx src/styles.css tests/e2e/application.spec.ts
          if ! git diff --cached --quiet; then git commit -m 'Fix source-selection effects and constrain mobile player messages'; git push origin HEAD:refs/heads/fix/solanime-quality-pass; fi
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run complete browser regression suite
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-regression-evidence
          path: |
            browser.log
            playwright-report/
            test-results/
            src/pages/WatchPage.tsx
            src/styles.css
            tests/e2e/application.spec.ts
          retention-days: 7
