name: Isolated UI refinement verification
on:
  push:
    branches: [audit/ui-workbench-20261001]
    paths: [.github/workflows/ui-workbench.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e6b5689d79ffa6c8f04d39b2fbb2ffc772d4d9b
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0bb17b55dab7371ce996d3abf171272be51fbf8e
          path: repo
          persist-credentials: false
      - name: Verify transport before applying changes
        run: |
          mkdir -p /tmp/ui-review
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = Path('transport/.audit/ui-review.patch.gz.b64').read_text().strip()
          for old, new in [('SMXNS6a6pll', 'SMXNS6pll'), ('IPC5yvF9W', 'IPC5yvX9W'), ('Gy9re+9sf', 'Gy9+x10sf')]:
              payload = payload.replace(old, new)
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5cb1abd34ba1d664aa7dbda5843b0ace2f4f74e8bd62aa06c5a62629d0ab9b01'
          Path('/tmp/ui-review/ui-review.patch').write_bytes(patch)
          PY
          cd repo
          git apply --check /tmp/ui-review/ui-review.patch
          git apply /tmp/ui-review/ui-review.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/catalogue-artwork-review.spec.ts')
          s=p.read_text().replace('images.filter(image => image.getBoundingClientRect()', 'images.filter((image): image is HTMLImageElement => image instanceof HTMLImageElement && image.getBoundingClientRect()')
          p.write_text(s)
          PY
          git add -N scripts/review-artwork.mjs src/components/SavedTitleActions.tsx tests/e2e/ui-polish-regressions.spec.ts tests/e2e/catalogue-artwork-review.spec.ts
          git diff > /tmp/ui-review/final.patch
          git status --short > /tmp/ui-review/changed-files.txt
          tar -czf /tmp/ui-review/patched-client.tar.gz src tests scripts extensions
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and check
        working-directory: repo
        run: |
          set -o pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm check 2>&1 | tee /tmp/ui-review/check.log
          node --test mobile-prototype/ios/source-contract.test.cjs 2>&1 | tee /tmp/ui-review/native-source.log
          pnpm --dir desktop-prototype test 2>&1 | tee /tmp/ui-review/desktop-policy.log
      - name: Capture optional public artwork
        working-directory: repo
        run: node scripts/review-artwork.mjs /tmp/ui-review/public-artwork > /tmp/ui-review/artwork.log 2>&1 || true
      - name: Render focused mobile and desktop flows
        working-directory: repo
        env:
          SOLANIME_REVIEW_ARTWORK: /tmp/ui-review/public-artwork
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium webkit
          pnpm exec playwright test tests/e2e/ui-polish-regressions.spec.ts tests/e2e/streaming-surface-review.spec.ts tests/e2e/shell-style.spec.ts tests/e2e/ux-account-refresh.spec.ts tests/e2e/catalogue-artwork-review.spec.ts --workers=2 --retries=0 --output=/tmp/ui-review/test-results --reporter=line 2>&1 | tee /tmp/ui-review/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-review
          path: /tmp/ui-review/
          retention-days: 5
